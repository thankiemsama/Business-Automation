services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa-local-only
      POSTGRES_DB: nexa
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "nexa", "-d", "nexa"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: ${NEXA_MINIO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46}
    command: server /data
    environment:
      MINIO_ROOT_USER: ${NEXA_MINIO_USER:-nexa-local}
      MINIO_ROOT_PASSWORD: ${NEXA_MINIO_PASSWORD:-nexa-minio-local-only}
    volumes:
      - minio-data:/data

  minio-init:
    image: ${NEXA_MINIO_CLIENT_IMAGE:-docker.io/pgsty/mc:RELEASE.2026-09-16T00-00-00Z}
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${NEXA_MINIO_USER:-nexa-local}
      MINIO_ROOT_PASSWORD: ${NEXA_MINIO_PASSWORD:-nexa-minio-local-only}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 30); do
          if mc alias set nexa http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; then
            mc mb --ignore-existing nexa/nexa-attachments
            exit 0
          fi
          sleep 2
        done
        exit 1

  backend:
    build: ./BACKEND
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://nexa:nexa-local-only@postgres:5432/nexa?sslmode=disable
      APP_ORIGIN: http://127.0.0.1:${NEXA_PORT:-3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SUPPORT_REPLY_TO: ${SUPPORT_REPLY_TO:-}
      INBOUND_EMAIL_TENANT: ${INBOUND_EMAIL_TENANT:-}
      RESEND_INBOUND_ADDRESS: ${RESEND_INBOUND_ADDRESS:-}
      RESEND_INBOUND_WEBHOOK_SECRET: ${RESEND_INBOUND_WEBHOOK_SECRET:-}
      RESEND_INBOUND_API_KEY: ${RESEND_INBOUND_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NEXA_CHANNEL_CREDENTIALS: ${NEXA_CHANNEL_CREDENTIALS:-}
      ATTACHMENT_S3_ENDPOINT: http://minio:9000
      ATTACHMENT_S3_BUCKET: nexa-attachments
      ATTACHMENT_S3_ACCESS_KEY: ${NEXA_MINIO_USER:-nexa-local}
      ATTACHMENT_S3_SECRET_KEY: ${NEXA_MINIO_PASSWORD:-nexa-minio-local-only}
      ATTACHMENT_MIGRATE_ON_READ: ${ATTACHMENT_MIGRATE_ON_READ:-false}
      # Multi-replica SSE: set NEXA_NATS_URL=nats://nats:4222 to fan events
      # across backend replicas. Empty (default) keeps the in-process fanout.
      NEXA_NATS_URL: ${NEXA_NATS_URL:-}
      NEXA_NATS_USER: ${NEXA_NATS_USER:-}
      NEXA_NATS_PASSWORD: ${NEXA_NATS_PASSWORD:-}
      NEXA_FANOUT_EPOCH: ${NEXA_FANOUT_EPOCH:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE: ${STRIPE_PRO_PRICE:-}
      STRIPE_ENTERPRISE_PRICE: ${STRIPE_ENTERPRISE_PRICE:-}
      NEXA_BILLING_FREE_TICKETS_LIMIT: ${NEXA_BILLING_FREE_TICKETS_LIMIT:-}
      NEXA_BILLING_FREE_AI_LIMIT: ${NEXA_BILLING_FREE_AI_LIMIT:-}
      NEXA_BILLING_PRO_TICKETS_LIMIT: ${NEXA_BILLING_PRO_TICKETS_LIMIT:-}
      NEXA_BILLING_PRO_AI_LIMIT: ${NEXA_BILLING_PRO_AI_LIMIT:-}
      NEXA_BILLING_ENTERPRISE_TICKETS_LIMIT: ${NEXA_BILLING_ENTERPRISE_TICKETS_LIMIT:-}
      NEXA_BILLING_ENTERPRISE_AI_LIMIT: ${NEXA_BILLING_ENTERPRISE_AI_LIMIT:-}
      NEXA_BILLING_PRO_TICKETS_INVOICE_CREDITS: ${NEXA_BILLING_PRO_TICKETS_INVOICE_CREDITS:-}
      NEXA_BILLING_PRO_AI_INVOICE_CREDITS: ${NEXA_BILLING_PRO_AI_INVOICE_CREDITS:-}
      NEXA_BILLING_ENTERPRISE_TICKETS_INVOICE_CREDITS: ${NEXA_BILLING_ENTERPRISE_TICKETS_INVOICE_CREDITS:-}
      NEXA_BILLING_ENTERPRISE_AI_INVOICE_CREDITS: ${NEXA_BILLING_ENTERPRISE_AI_INVOICE_CREDITS:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build: ./FRONTEND
    init: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      APP_ORIGIN: http://127.0.0.1:${NEXA_PORT:-3000}
    ports:
      - "127.0.0.1:${NEXA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    image: ${NEXA_NATS_IMAGE:-nats:2.10-alpine}
    command: ["--js"]
    volumes:
      - nats-data:/data
    # Khi bật multi-replica, đặt NEXA_NATS_URL cho mỗi backend.
    # compose.private.yaml (on-prem) giữ NATS chạy ngoài container bundle.

volumes:
  postgres-data:
  minio-data:
  nats-data:

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa-ci
          POSTGRES_DB: nexa
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nexa -d nexa"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: BACKEND/go.sum
      - name: Check gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt: files not formatted:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://nexa:nexa-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/nexa?sslmode=disable
      - name: Race detector (concurrency-heavy packages)
        run: go test -race ./internal/api/... ./internal/service/... ./internal/repository/...
        env:
          TEST_DATABASE_URL: postgres://nexa:nexa-ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/nexa?sslmode=disable

  frontend-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: FRONTEND/package-lock.json
      - name: Lint and typecheck frontend
        working-directory: FRONTEND
        run: |
          npm ci
          npm run lint
          npm run typecheck
      - name: Build and start isolated stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Test BFF against PostgreSQL
        working-directory: FRONTEND
        env:
          TEST_FRONTEND_URL: http://127.0.0.1:3000
        run: npm run test:integration
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes

projects:
  - name: Business-Automation
    environments:
      - name: Production
        services:
          - type: web
            name: nexa-web
            runtime: docker
            region: singapore
            plan: free
            dockerfilePath: ./Dockerfile.render
            healthCheckPath: /
            envVars:
              - key: DATABASE_URL
                fromDatabase:
                  name: nexa-postgres
                  property: connectionString
        databases:
          - name: nexa-postgres
            region: singapore
            plan: free
            postgresMajorVersion: "16"
            databaseName: nexa
            user: nexa
            ipAllowList: []
